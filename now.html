	</div>

	<script src="gh.js"></script>
	<script src="site.js"></script>
	<script>
		async function renderTransmissions() {
			const host = document.getElementById('transmissions');
			const notes = await Site.fetchNotes('notes.json');

			if (!notes || notes.length === 0) {
				host.innerHTML = '<div class="transmission-item"><span class="transmission-date">--</span><span class="transmission-text" style="color:rgba(26,16,8,0.35)">// no transmissions yet</span></div>';
				return;
			}

			// Sort newest first, take top 5
			const sorted = [...notes].sort((a, b) => {
				const da = a.date ? new Date(a.date) : 0;
				const db = b.date ? new Date(b.date) : 0;
				return db - da;
			}).slice(0, 5);

			host.innerHTML = sorted.map(n => {
				const d = n.date ? new Date(n.date) : null;
				const dateLabel = d
					? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
					: '--';
				return `
					<div class="transmission-item">
						<span class="transmission-date">${GH.escapeHtml(dateLabel)}</span>
						<span class="transmission-text">${GH.escapeHtml(n.text || '')}</span>
					</div>
				`;
			}).join('');
		}

		renderTransmissions();
		Site.injectNav(); Site.injectFooter();
	</script>
</body>
