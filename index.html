<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Zachary Blauser</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<div class="image-block">
			<img src="assets/profile.jpg" alt="Zachary Blauser">
		</div>

		<div class="text-block">
			<h1>ZACHARY BLAUSER</h1>
			<p class="subtitle">systems programmer<br>infrastructure automation<br>developer tooling</p>
		</div>

		<div class="activity-feed">
			<h3>// latest releases</h3>
			<ul class="activity-list" id="activity-list">
				<li class="activity-loading">fetching commits...</li>
			</ul>
		</div>

		<nav class="nav-block">
			<a href="projects.html">PROJECTS</a>
			<a href="now.html">NOW</a>
			<a href="log.html">LOG</a>
			<a href="about.html">ABOUT</a>
			<a href="uses.html">TOOLS</a>
			<a href="mailto:zacharymblauser@gmail.com" class="contact-cta">CONTACT</a>
		</nav>
	</div>

	<script src="gh.js"></script>
	<script src="site.js"></script>
	<script>
		async function renderActivity() {
			const list = document.getElementById('activity-list');
			const { releases } = await GH.fetchReleases();

			if (!releases || releases.length === 0) {
				list.innerHTML = '<li class="activity-item"><span class="message">// no releases yet</span></li>';
				return;
			}

			list.innerHTML = releases.map(r => `
				<li class="activity-item">
					<span class="repo">${GH.escapeHtml(r.repo)}</span>
					<span class="message"><a href="${r.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(26,16,8,0.2)">${GH.escapeHtml(r.tag)}</a></span>
					<span class="time">${GH.timeAgo(r.time)}</span>
				</li>
			`).join('');
		}

		renderActivity();
		Site.injectNav({ variant: 'home' }); Site.injectFooter({ variant: 'home', sig: '// transmission continues' });
	</script>
</body>
</html>
