<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log — Zachary Blauser</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
	<nav class="top-nav"></nav>

	<div class="inner-container">
		<header class="inner-header">
			<h1>LOG</h1>
			<span class="header-sub">// activity across the wire</span>
		</header>

		<div id="log-container">
			<p class="log-loading">// fetching signals...</p>
		</div>
	</div>

	<script src="gh.js"></script>
	<script src="site.js"></script>
	<script>
		function getWeekStart(dateStr) {
			const d = new Date(dateStr);
			const day = d.getDay();
			const diff = day === 0 ? -6 : 1 - day;
			const mon = new Date(d);
			mon.setDate(d.getDate() + diff);
			mon.setHours(0, 0, 0, 0);
			return mon;
		}

		function formatWeekRange(weekStart) {
			const end = new Date(weekStart);
			end.setDate(weekStart.getDate() + 6);
			const s = weekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
			const e = end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
			return `${s} – ${e}`;
		}

		function groupByWeek(items) {
			const map = new Map();
			for (const item of items) {
				const ws = getWeekStart(item.time);
				const key = ws.toISOString();
				if (!map.has(key)) map.set(key, { weekStart: ws, items: [] });
				map.get(key).items.push(item);
			}
			return Array.from(map.values()).sort((a, b) => b.weekStart - a.weekStart);
		}

		function sourceBadge(source) {
			const cls = source === 'dev.to' ? 'src-dev'
				: source === 'rust' ? 'src-rust'
				: 'src-gh';
			const label = source === 'dev.to' ? 'dev.to'
				: source === 'rust' ? 'rust'
				: 'github';
			return `<span class="log-source ${cls}">${label}</span>`;
		}

		function renderEntry(c) {
			const repoChunk = c.source === 'github'
				? `<a href="${c.repoUrl}" class="log-repo" target="_blank" rel="noopener">${GH.escapeHtml(c.repo)}</a>`
				: `<span class="log-repo">${GH.escapeHtml(c.repo || c.source)}</span>`;

			const shaChunk = c.sha
				? `<a href="${c.url}" class="log-sha" target="_blank" rel="noopener">${GH.escapeHtml(c.sha)}</a>`
				: '';

			// For dev.to, the title is clickable; for github, we link the message to the commit
			let messageHtml;
			if (c.source === 'dev.to') {
				messageHtml = `<a href="${c.url}" target="_blank" rel="noopener">${GH.escapeHtml(c.title || c.message)}</a>`;
			} else if (c.url) {
				messageHtml = `<a href="${c.url}" target="_blank" rel="noopener">${GH.escapeHtml(c.message)}</a>`;
			} else {
				messageHtml = GH.escapeHtml(c.message);
			}

			return `
				<div class="log-entry">
					<div class="log-entry-header">
						${sourceBadge(c.source)}
						${repoChunk}
						${shaChunk}
					</div>
					<p class="log-message">${messageHtml}</p>
					${c.body ? `<p class="log-body">${GH.escapeHtml(c.body)}</p>` : ''}
				</div>
			`;
		}

		async function renderLog() {
			const container = document.getElementById('log-container');

			const [ghResult, devArticles, rustPosts] = await Promise.all([
				GH.fetchEvents(),
				Site.fetchDevtoArticles('zblauser'),
				Site.fetchRustForumPosts('zblauser')
			]);

			const ghEvents = ghResult.events || [];
			const devItems = (devArticles || []).map(a => ({
				source: 'dev.to',
				repo: 'dev.to',
				repoUrl: 'https://dev.to/zblauser',
				sha: '',
				message: a.title,
				title: a.title,
				body: '',
				time: a.time,
				url: a.url
			}));
			const rustItems = (rustPosts || []).map(p => ({
				source: 'rust',
				repo: 'rust forum',
				repoUrl: 'https://users.rust-lang.org/u/zblauser',
				sha: '',
				message: p.kind ? `${p.kind}: ${p.title}` : p.title,
				title: p.title,
				body: '',
				time: p.time,
				url: p.url
			}));

			const all = [...ghEvents, ...devItems, ...rustItems]
				.filter(x => x.time)
				.sort((a, b) => new Date(b.time) - new Date(a.time))
				.slice(0, 40);

			if (all.length === 0) {
				container.innerHTML = '<p class="log-empty">// no signal</p>';
				return;
			}

			const weeks = groupByWeek(all);
			const html = weeks.map((week, i) => {
				const label = formatWeekRange(week.weekStart);
				const isFirst = i === 0;
				return `
					<div class="log-week">
						<button class="log-week-toggle" aria-expanded="${isFirst}">
							<span class="log-week-label">// ${label}</span>
							<span class="log-week-count">${week.items.length} entries</span>
						</button>
						<div class="log-week-body" ${isFirst ? '' : 'hidden'}>
							${week.items.map(renderEntry).join('')}
						</div>
					</div>
				`;
			}).join('');

			container.innerHTML = html;

			container.querySelectorAll('.log-week-toggle').forEach(btn => {
				btn.addEventListener('click', () => {
					const body = btn.nextElementSibling;
					const nowOpen = body.hidden;
					body.hidden = !nowOpen;
					btn.setAttribute('aria-expanded', nowOpen);
				});
			});
		}

		renderLog();
		Site.injectNav(); Site.injectFooter();
	</script>
</body>
</html>
